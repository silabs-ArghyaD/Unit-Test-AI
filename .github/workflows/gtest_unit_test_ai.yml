name: "Unit Test Validator"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  analyze-pr-changes:
    name: "Analyze PR Changes"
    runs-on: ubuntu-latest
    outputs:
      total-changes: ${{ steps.calculate.outputs.total-changes }}
      required-coverage: ${{ steps.calculate.outputs.required-coverage }}
      has-cpp-files: ${{ steps.calculate.outputs.has-cpp-files }}
      cpp-files: ${{ steps.calculate.outputs.cpp-files }}
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Fetch PR Diff using GitHub REST API"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          curl -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files" > pr_diff.json

          echo "=== PR Diff JSON Response ==="
          cat pr_diff.json

      - name: "Filter C/C++ files and calculate changes"
        id: calculate
        run: |
          # Filter C/C++ files from the PR diff
          jq -r '.[] | select(.filename | test("\\.(c|cpp|cc|cxx|h|hpp|hxx)$")) | .filename' pr_diff.json > cpp_files.txt

          echo "C/C++ files changed in this PR:"
          cat cpp_files.txt

          # Calculate total lines added for C/C++ files
          TOTAL_CHANGES=$(jq -r '.[] | select(.filename | test("\\.(c|cpp|cc|cxx|h|hpp|hxx)$")) | (.additions)' pr_diff.json | awk '{sum += $1} END {print sum}')

          # Handle case when no C/C++ files are found
          if [ -z "$TOTAL_CHANGES" ] || [ "$TOTAL_CHANGES" = "0" ]; then
            echo "No C/C++ files changed in this PR"
            echo "total-changes=0" >> $GITHUB_OUTPUT
            echo "required-coverage=0" >> $GITHUB_OUTPUT
            echo "has-cpp-files=false" >> $GITHUB_OUTPUT
            echo "cpp-files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== PR Change Summary ==="
          echo "Total lines added in C/C++ files: $TOTAL_CHANGES"

          # Determine required code coverage based on number of changes
          if [ "$TOTAL_CHANGES" -le 10 ]; then
            REQUIRED_COVERAGE=90
            echo "Changes are minimal (≤10 lines)"
          else
            REQUIRED_COVERAGE=100
            echo "Changes are significant (>10 lines)"
          fi

          echo "Required code coverage: ${REQUIRED_COVERAGE}%"

          # Convert cpp_files.txt to comma-separated string for output
          CPP_FILES=$(cat cpp_files.txt | tr '\n' ',' | sed 's/,$//')

          # Store values for other jobs
          echo "total-changes=$TOTAL_CHANGES" >> $GITHUB_OUTPUT
          echo "required-coverage=$REQUIRED_COVERAGE" >> $GITHUB_OUTPUT
          echo "has-cpp-files=true" >> $GITHUB_OUTPUT
          echo "cpp-files=$CPP_FILES" >> $GITHUB_OUTPUT

          # Print detailed breakdown
          echo ""
          echo "=== Detailed File Changes ==="
          jq -r '.[] | select(.filename | test("\\.(c|cpp|cc|cxx|h|hpp|hxx)$")) | "File: \(.filename) | Additions: \(.additions) | Deletions: \(.deletions) | Total: \(.additions + .deletions)"' pr_diff.json

  find-and-validate-tests:
    name: "Find Tests & AI Validation"
    runs-on: ubuntu-latest
    needs: analyze-pr-changes
    if: needs.analyze-pr-changes.outputs.has-cpp-files == 'true'
    outputs:
      has-test-mappings: ${{ steps.mapping.outputs.has-mappings }}
      files-with-tests: ${{ steps.mapping.outputs.files-with-tests }}
      test-files: ${{ steps.mapping.outputs.test-files }}
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: "Install Python dependencies"
        run: |
          pip install requests litellm

      - name: "Find Existing GTest Unit Tests"
        id: mapping
        env:
          CPP_FILES: ${{ needs.analyze-pr-changes.outputs.cpp-files }}
        run: |
          echo "=== Finding Existing GTest Unit Tests ==="

          # Convert comma-separated string back to array
          IFS=',' read -ra modified_files <<< "$CPP_FILES"
          echo "Modified C/C++ files: ${#modified_files[@]}"

          # Find all GTest files recursively from src/app/tests
          if [ -d "src/app/tests" ]; then
            echo "Searching for GTest files in src/app/tests..."
            
            # Find test files containing gtest patterns
            find src/app/tests -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) -exec grep -l "TEST\|EXPECT_\|ASSERT_" {} \; > found_test_files.txt 2>/dev/null
            
            test_file_count=$(wc -l < found_test_files.txt 2>/dev/null || echo "0")
            echo "Total GTest files found: $test_file_count"
            
            # Map modified files to test files
            files_with_tests=0
            > file_test_mapping.txt
            declare -a all_test_files
            
            for modified_file in "${modified_files[@]}"; do
              if [ -n "$modified_file" ]; then
                # Method: Look for includes of the modified file in test files
                include_tests=""
                if [ -f "$modified_file" ]; then
                  include_name=$(basename "$modified_file")
                  include_tests=$(find src/app/tests -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) -exec grep -l "#include.*${include_name}" {} \; 2>/dev/null || true)
                fi
                
                if [ -n "$include_tests" ]; then
                  files_with_tests=$((files_with_tests + 1))
                  echo "$modified_file:$include_tests" >> file_test_mapping.txt
                  # Add test files to array
                  while IFS= read -r test_file; do
                    all_test_files+=("$test_file")
                  done <<< "$include_tests"
                else
                  echo "$modified_file:" >> file_test_mapping.txt
                fi
              fi
            done
            
            echo "Files with existing tests: $files_with_tests out of ${#modified_files[@]}"
            
            if [ "$files_with_tests" -gt 0 ]; then
              cat file_test_mapping.txt
              echo "has-mappings=true" >> $GITHUB_OUTPUT
              
              # Remove duplicates and convert to comma-separated string
              TEST_FILES=$(printf '%s\n' "${all_test_files[@]}" | sort -u | tr '\n' ',' | sed 's/,$//')
              echo "test-files=$TEST_FILES" >> $GITHUB_OUTPUT
            else
              echo "has-mappings=false" >> $GITHUB_OUTPUT
              echo "test-files=" >> $GITHUB_OUTPUT
            fi
            
            echo "files-with-tests=$files_with_tests" >> $GITHUB_OUTPUT

          else
            echo "src/app/tests directory not found"
            echo "has-mappings=false" >> $GITHUB_OUTPUT
            echo "files-with-tests=0" >> $GITHUB_OUTPUT
            echo "test-files=" >> $GITHUB_OUTPUT
          fi

      # - name: "Run Unit Test Validator with AI"
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     echo "=== Running AI-Powered Unit Test Validation ==="
      #     
      #     # Check if we have any test files
      #     if [ -z "${{ steps.mapping.outputs.test-files }}" ]; then
      #       echo "No test files found"
      #       exit 0
      #     fi
      #     
      #     # Create test files list for Python script
      #     echo "${{ steps.mapping.outputs.test-files }}" | tr ',' '\n' > test_files_list.txt
      #     
      #     # Run the Python validator
      #     python validate_tests.py --test-files test_files_list.txt --output validation_report.md
      #     
      #     echo "=== Validation Complete ==="
      #     
      #     # Display summary from the report
      #     if [ -f "validation_report.md" ]; then
      #       echo "Validation report generated successfully"
      #       
      #       # Extract and display summary section
      #       echo ""
      #       echo "=== VALIDATION SUMMARY ==="
      #       grep -A 10 "## Summary" validation_report.md || echo "Could not extract summary"
      #     fi

  code-coverage-analysis:
    name: "Code Coverage Analysis"
    runs-on: ubuntu-latest
    needs: [analyze-pr-changes, find-and-validate-tests]
    if: needs.find-and-validate-tests.outputs.has-test-mappings == 'true'
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Install GCC and GCov for Code Coverage"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gcov lcov

      - name: "Check Code Coverage of Mapped Files"
        env:
          REQUIRED_COVERAGE: ${{ needs.analyze-pr-changes.outputs.required-coverage }}
          TEST_FILES: ${{ needs.find-and-validate-tests.outputs.test-files }}
        run: |
          echo "=== Checking Code Coverage with GCov ==="
          echo "Required Coverage: $REQUIRED_COVERAGE%"
          
          # Check if we have test files
          if [ -z "$TEST_FILES" ]; then
            echo "No test files found - skipping coverage analysis"
            exit 0
          fi
          
          # Create coverage directory
          mkdir -p coverage_reports
          
          # Convert comma-separated test files to newline-separated
          echo "$TEST_FILES" | tr ',' '\n' > test_files_to_run.txt
          
          test_count=$(wc -l < test_files_to_run.txt 2>/dev/null || echo "0")
          echo "Found $test_count test files to analyze for coverage"
          
          echo "=== Test files to analyze ==="
          cat test_files_to_run.txt
          
          # Initialize coverage counters
          total_files=0
          covered_files=0
          > coverage_summary.txt
          
          # Process each test file for coverage
          while IFS= read -r test_file; do
            if [ -f "$test_file" ]; then
              echo ""
              echo "=== Analyzing coverage for: $test_file ==="
              
              # Extract the directory and filename
              test_dir=$(dirname "$test_file")
              test_name=$(basename "$test_file" .cpp)
              
              # Compile with coverage flags
              echo "Compiling $test_file with coverage flags..."
              
              # Try to compile with gcov flags (this may fail if dependencies are missing)
              if g++ -fprofile-arcs -ftest-coverage -o "coverage_reports/${test_name}_test" "$test_file" 2>/dev/null; then
                echo "✅ Compilation successful for $test_file"
                
                # Run the test (if it compiles and runs)
                cd coverage_reports
                if ./"${test_name}_test" 2>/dev/null; then
                  echo "✅ Test execution successful"
                  
                  # Generate coverage data
                  gcov "../$test_file" 2>/dev/null || true
                  
                  # Check if .gcov files were generated
                  if ls *.gcov 1> /dev/null 2>&1; then
                    echo "✅ Coverage data generated"
                    
                    # Parse coverage for the source files being tested
                    for gcov_file in *.gcov; do
                      if [ -f "$gcov_file" ]; then
                        # Extract coverage percentage
                        lines_total=$(grep -c ":" "$gcov_file" 2>/dev/null || echo "0")
                        lines_executed=$(grep -c "    [0-9]" "$gcov_file" 2>/dev/null || echo "0")
                        
                        if [ "$lines_total" -gt 0 ]; then
                          coverage_percent=$(awk "BEGIN {printf \"%.1f\", ($lines_executed/$lines_total)*100}")
                          echo "Coverage for $gcov_file: $coverage_percent% ($lines_executed/$lines_total lines)"
                          echo "$test_file,$gcov_file,$coverage_percent,$lines_executed,$lines_total" >> ../coverage_summary.txt
                          covered_files=$((covered_files + 1))
                        fi
                      fi
                    done
                  else
                    echo "⚠️  No coverage data generated for $test_file"
                  fi
                else
                  echo "⚠️  Test execution failed for $test_file"
                fi
                cd ..
              else
                echo "⚠️  Compilation failed for $test_file (missing dependencies)"
              fi
              
              total_files=$((total_files + 1))
            else
              echo "⚠️  Test file not found: $test_file"
            fi
          done < test_files_to_run.txt
          
          echo ""
          echo "=== COVERAGE ANALYSIS SUMMARY ==="
          echo "Total test files processed: $total_files"
          echo "Files with coverage data: $covered_files"
          
          if [ -f "coverage_summary.txt" ] && [ -s "coverage_summary.txt" ]; then
            echo ""
            echo "=== DETAILED COVERAGE RESULTS ==="
            echo "Test File,Coverage File,Coverage %,Lines Executed,Total Lines"
            cat coverage_summary.txt
            
            # Calculate overall statistics
            if [ "$covered_files" -gt 0 ]; then
              avg_coverage=$(awk -F, '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "0"}' coverage_summary.txt)
              total_executed=$(awk -F, '{sum+=$4} END {print sum}' coverage_summary.txt)
              total_lines=$(awk -F, '{sum+=$5} END {print sum}' coverage_summary.txt)
              
              echo ""
              echo "=== OVERALL COVERAGE STATISTICS ==="
              echo "Average Coverage: $avg_coverage%"
              echo "Total Lines Executed: $total_executed"
              echo "Total Lines: $total_lines"
              echo "Required Coverage: $REQUIRED_COVERAGE%"
              
              # Check if coverage meets requirements
              if awk "BEGIN {exit !($avg_coverage >= $REQUIRED_COVERAGE)}"; then
                echo "✅ Coverage requirement MET ($avg_coverage% >= $REQUIRED_COVERAGE%)"
              else
                echo "❌ Coverage requirement NOT MET ($avg_coverage% < $REQUIRED_COVERAGE%)"
                echo "::error::Code coverage ($avg_coverage%) is below required threshold ($REQUIRED_COVERAGE%)"
                exit 1
              fi
            fi
          else
            echo "No coverage data could be generated"
            echo "This may be due to missing dependencies or compilation issues"
          fi
